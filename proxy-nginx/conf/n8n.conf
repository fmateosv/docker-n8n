# Personalización del proxy para n8n
server {
    listen 80;
    server_name n8n.midominio.com;

    # Redirección a HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name n8n.fmateos.es;

    ssl_certificate /etc/nginx/certs/n8n.fmateos.es/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/n8n.fmateos.es/key.pem;

    client_max_body_size 100M;

    location / {
        proxy_pass http://n8n:5678;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }
}
