version: "3.8"

services:
  code-sandbox:
    image: codercom/code-server:latest
    container_name: code-sandbox
    restart: always
    env_file:
      - ../.env.global
    environment:
      - PASSWORD=${CODE_PASS}
      - VIRTUAL_HOST=n8n-sandbox.fmateos.es
      - LETSENCRYPT_HOST=n8n-sandbox.fmateos.es
      - LETSENCRYPT_EMAIL=${SSL_EMAIL}
    volumes:
      - ./data:/home/coder/project
    ports:
      - "3200:3200"
    networks:
      - infra_net

networks:
  infra_net:
    external: true
