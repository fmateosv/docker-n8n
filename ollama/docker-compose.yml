version: "3.8"

services:
  ollama:
    container_name: ollama
    image: ollama/ollama:latest
    restart: always
    env_file:
      - ../.env.global
    ports:
      - "11434:11434"
    volumes:
      - ./models:/root/.ollama
    networks:
      - infra_net

networks:
  infra_net:
    external: true
