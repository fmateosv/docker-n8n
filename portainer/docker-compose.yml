version: "3.8"

services:
  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    restart: always
    env_file:
      - ../.env.global
    ports:
      - "9000:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data:/data
    environment:
      - VIRTUAL_HOST=portainer.midominio.com
      - LETSENCRYPT_HOST=portainer.midominio.com
      - LETSENCRYPT_EMAIL=${SSL_EMAIL}
    networks:
      - infra_net

networks:
  infra_net:
    external: true
